name: Build and Publish Android APK Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release PRANSETU APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "android/PRANSETU/gradlew" ]; then
            chmod +x android/PRANSETU/gradlew
          fi
          if [ -f "PRANSETU(android)/android/PRANSETU/gradlew" ]; then
            chmod +x PRANSETU(android)/android/PRANSETU/gradlew
          fi

      - name: Build Debug APK
        run: |
          cd android/PRANSETU
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRANSETU-app-debug
          path: android/PRANSETU/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/PRANSETU/app/build/outputs/apk/debug/app-debug.apk
          name: PRANSETU Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
